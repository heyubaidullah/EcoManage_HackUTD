services:
  - type: web
    name: ecomanage-api
    runtime: python
    buildCommand: pip install -r version1.2/requirements.txt
    startCommand: gunicorn --bind=0.0.0.0:$PORT --reuse-port --chdir=version1.2 app:app
    envVars:
      - key: DATABASE_URL
        sync: false           # paste your Supabase connection string in the Render dashboard
      - key: PYTHON_VERSION
        value: 3.12.0
